name: Release DMG

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v prefix"
        required: true
        default: "1.0.0"
      build:
        description: "CFBundleVersion"
        required: true
        default: "100"
      prerelease:
        description: "Mark the GitHub Release as prerelease"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build unsigned Streamly DMG
    runs-on: macos-15
    env:
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: submodule.SQLiteCustom/src.update
      GIT_CONFIG_VALUE_0: none

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            BUILD="${{ inputs.build }}"
            PRERELEASE="${{ inputs.prerelease }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
            BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Configuration/Streamly-Info.plist)"
            PRERELEASE="false"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Test
        run: swift test

      - name: Install ffmpeg runtime
        run: brew install ffmpeg

      - name: Build DMG
        run: script/create_dmg.sh --version "${{ steps.version.outputs.version }}" --build "${{ steps.version.outputs.build }}" --sign -

      - name: Generate SHA-256
        shell: bash
        run: |
          DMG="dist/dmg/Streamly-${{ steps.version.outputs.version }}.dmg"
          (cd "$(dirname "$DMG")" && shasum -a 256 "$(basename "$DMG")") > "$DMG.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Streamly-${{ steps.version.outputs.version }}-dmg
          path: |
            dist/dmg/Streamly-${{ steps.version.outputs.version }}.dmg
            dist/dmg/Streamly-${{ steps.version.outputs.version }}.dmg.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Streamly ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            dist/dmg/Streamly-${{ steps.version.outputs.version }}.dmg
            dist/dmg/Streamly-${{ steps.version.outputs.version }}.dmg.sha256

      - name: Generate Sparkle appcast
        shell: bash
        run: |
          test -n "$SPARKLE_PRIVATE_KEY"
          DMG="dist/dmg/Streamly-${{ steps.version.outputs.version }}.dmg"
          SPARKLE_DIR="dist/sparkle"
          SPARKLE_KEY="$RUNNER_TEMP/sparkle_private_key"
          mkdir -p "$SPARKLE_DIR"
          cp "$DMG" "$SPARKLE_DIR/"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$SPARKLE_KEY"
          chmod 600 "$SPARKLE_KEY"
          .build/artifacts/sparkle/Sparkle/bin/generate_appcast \
            --ed-key-file "$SPARKLE_KEY" \
            --download-url-prefix "https://github.com/GanbarovEmin/streamly/releases/download/${{ steps.version.outputs.tag }}" \
            "$SPARKLE_DIR"
          test -f "$SPARKLE_DIR/appcast.xml"

      - name: Stage Pages with appcast
        shell: bash
        run: |
          mkdir -p dist/pages
          cp -R landing/. dist/pages/
          cp dist/sparkle/appcast.xml dist/pages/appcast.xml

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

      - name: Deploy Pages appcast
        uses: actions/deploy-pages@v4
